<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartas digitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #dedad3;
    --paper: #f7f4ee;
    --ink: #0a0a0a;
    --muted: #5c5852;
    --accent: #256f82;
    --m: clamp(12px, 3vw, 40px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "EB Garamond", Georgia, serif; font-size: 1.125rem; line-height: 1.5;
  }
  .wrap { padding: var(--m); max-width: 640px; margin: 0 auto; }
  .kicker { color: var(--muted); font-size: 0.875rem; margin: 40px 0 6px; }
  h1 { font-weight: 400; font-style: italic; font-size: clamp(2rem, 1.3rem + 3.2vw, 3.5rem); line-height: 1.1; margin: 0; }
  ul { list-style: none; margin: 32px 0 60px; padding: clamp(24px, 5vw, 48px); background: var(--paper); }
  li { padding: 10px 0; }
  a { color: var(--ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .meta { display: block; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Cartas digitales</p>
  <h1>Elige tu carta</h1>
  <ul>
    <li>
      <a href="cafe-bar-central/">Café Bar Central</a>
      <span class="meta">Chiclana de la Frontera · desayuno y merienda</span>
    </li>
  </ul>
</main>
</body>
</html>
